version: 2.1

jobs:
  build:
    environment:
      # Configure the JVM and Gradle to avoid OOM errors
      _JAVA_OPTIONS: "-Xmx3g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      # The image sets JAVA_TOOL_OPTIONS=-XX:-UseBASE64Intrinsics, which Java 8 rejects, so the Java 8
      # that testOnJava8 uses cannot start. JDK_JAVA_OPTIONS keeps the flag for JDK 17 only.
      JAVA_TOOL_OPTIONS: ""
      JDK_JAVA_OPTIONS: "-XX:-UseBASE64Intrinsics"
    docker:
      - image: cimg/openjdk:17.0

    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
            - gradle-
      - run:
          name: Install Java 8 for testOnJava8
          # Zulu 8 from Azul's CDN, pinned and checked against Azul's published checksum. Gradle's own
          # toolchain download gets Temurin from GitHub, which sends CircleCI an XML error instead of the
          # file, and Gradle keeps the bad download in ~/.gradle/jdks and fails on it again in every retry.
          command: |
            for attempt in 1 2 3; do
              status=$(curl -sSL --retry 5 --retry-all-errors -o jdk8.tar.gz -w '%{http_code}' https://cdn.azul.com/zulu/bin/zulu8.98.0.201-ca-jdk8.0.514-linux_x64.tar.gz) \
                && echo "16a4c55c3061ee41e94edb109f5aea1c55a2952d37e25e215d478b8347350860  jdk8.tar.gz" | sha256sum -c - \
                && break
              echo "Java 8 download attempt ${attempt} failed: HTTP ${status}, $(stat -c %s jdk8.tar.gz 2>/dev/null) bytes of $(file -b jdk8.tar.gz 2>/dev/null)"
              if file -b jdk8.tar.gz | grep -q text; then head -c 2000 jdk8.tar.gz; echo; fi
              rm -f jdk8.tar.gz
              [ "${attempt}" = 3 ] && exit 1
              sleep 30
            done
            mkdir -p ~/jdk8
            tar -xzf jdk8.tar.gz -C ~/jdk8 --strip-components=1
            rm jdk8.tar.gz
            ~/jdk8/bin/java -version
      - run:
          name: Test
          command: |
            for attempt in 1 2 3; do
              ./gradlew test testOnJava8 jacocoTestReport -Porg.gradle.java.installations.auto-download=false -Porg.gradle.java.installations.paths=$HOME/jdk8 && exit 0
              echo "Gradle failed on attempt ${attempt}, retrying in 30s..."
              sleep 30
            done
            exit 1
      - run:
          name: Publish coverage to Coveralls
          # Coveralls' official coverage reporter, pinned and checked against its published checksum.
          # It replaces the unmaintained coveralls-jacoco Gradle plugin, which put vulnerable versions
          # of jgit and kotlin-gradle-plugin on the build classpath.
          command: |
            curl -sSLO https://github.com/coverallsapp/coverage-reporter/releases/download/v0.6.22/coveralls-linux-x86_64.tar.gz
            curl -sSLO https://github.com/coverallsapp/coverage-reporter/releases/download/v0.6.22/coveralls-checksums.txt
            grep ' coveralls-linux-x86_64.tar.gz$' coveralls-checksums.txt | sha256sum -c -
            tar -xzf coveralls-linux-x86_64.tar.gz coveralls
            ./coveralls report build/reports/jacoco/test/jacocoTestReport.xml --format=jacoco --base-path=src/main/java
      - save_cache:
          key: gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}-{{ checksum "settings.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

workflows:
  workflow:
    jobs:
      - build
