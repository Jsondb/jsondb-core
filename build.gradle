plugins {
    id 'java'
    id 'jacoco'
    id 'com.github.nbaztec.coveralls-jacoco' version '1.2.20'
    id 'maven-publish'
    id 'signing'
    id 'eclipse'
    id 'idea'
}

description = 'A pure java JSON based database.'
group = 'io.jsondb'
version = getVersionName()

ext {
    println "Build Version: $version"

    slf4jVersion = '1.7.36'
    jacksonVersion = '2.18.8'
    guavaVersion = '33.6.0-jre'
    beanutilsVersion = '1.11.0'
    jxpathVersion = '1.4.0'
    reflectionsVersion = '8dc2bbd'
    dom4jVersion = '2.1.3'
    gsonVersion = '2.10.1'
    junitVersion = '4.13.2'
    hamcrestVersion = '2.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'commons-collections' && details.requested.name == 'commons-collections') {
                details.useVersion '3.2.2'
                details.because 'Pin commons-collections to latest 3.x with security fixes'
            }
        }
    }
}

dependencies {
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation 'com.fasterxml.jackson.core:jackson-databind',
            'com.fasterxml.jackson.module:jackson-module-parameter-names',
            'com.fasterxml.jackson.datatype:jackson-datatype-jdk8',
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation "com.github.Hatzen:reflections:${reflectionsVersion}",
            "commons-jxpath:commons-jxpath:${jxpathVersion}",
            "com.google.guava:guava:${guavaVersion}",
            "commons-beanutils:commons-beanutils:${beanutilsVersion}",
            "com.google.code.gson:gson:${gsonVersion}"

    implementation("org.dom4j:dom4j:${dom4jVersion}") {
        exclude group: 'pull-parser', module: 'pull-parser'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'xml-apis', module: 'xml-apis'
    }

    testImplementation "junit:junit:${junitVersion}",
            "org.hamcrest:hamcrest-library:${hamcrestVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.test {
    useJUnit()
    jvmArgs(
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
    )
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

eclipse {
    project {
        name = "${project.name}"
    }
}

eclipseJdt {
    inputFile = file("${rootDir}/buildsupport/eclipsesupport/settings/org.eclipse.jdt.core.prefs")
    doLast {
        copy {
            from "${rootDir}/buildsupport/eclipsesupport/settings/org.eclipse.jdt.ui.prefs"
            into "${projectDir}/.settings"
            fileMode 0644
        }
    }
}

cleanEclipseJdt {
    doFirst {
        delete "${projectDir}/.settings"
    }
}
tasks.eclipse.dependsOn(cleanEclipse)

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'jsondb-core'
                packaging = 'jar'
                description = 'A pure java JSON based database.'
                url = 'http://www.jsondb.io'

                scm {
                    connection = 'scm:git:https://github.com/Jsondb/jsondb-core.git'
                    developerConnection = 'scm:git:https://github.com/Jsondb/jsondb-core.git'
                    url = 'scm:git:https://github.com/Jsondb/jsondb-core.git'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'FarooqKhan'
                        name = 'Farooq Khan'
                        email = 'FarooqKhan@users.noreply.github.com'
                    }
                }
            }
        }
    }
    repositories {
        if (project.hasProperty('OSSRH_USERNAME') && project.hasProperty('OSSRH_PASSWORD')) {
            maven {
                name = 'OSSRH'
                def releasesRepoUrl = 'https://oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotsRepoUrl = 'https://oss.sonatype.org/content/repositories/snapshots/'
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = OSSRH_USERNAME
                    password = OSSRH_PASSWORD
                }
            }
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask('publish') && project.hasProperty('signing.keyId') }
    sign publishing.publications.mavenJava
}

/*
 * Gets the version name from the latest Git tag
 */
def getVersionName() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags'
            standardOutput = stdout
            ignoreExitValue = true
        }
        def raw = stdout.toString().trim()
        if (raw) {
            def versionString = raw.replaceFirst('-', '.')
            int dashIdx = versionString.indexOf('-')
            if (dashIdx > 0) {
                versionString = versionString.substring(0, dashIdx)
            }
            return versionString + '-j17'
        }
    } catch (Exception ignored) {
    }
    return '1.0-SNAPSHOT'
}
