buildscript {
    dependencies {
        constraints {
            // The publishing plugin uploads releases through retrofit, which asks for OkHttp 3.14.9.
            // That version can accept the wrong TLS certificate (CVE-2021-0341); OkHttp 4 is binary
            // compatible with 3.x and fixed.
            classpath('com.squareup.okhttp3:okhttp:4.12.0') {
                because 'OkHttp 3.14.9 has CVE-2021-0341 (GHSA-3cqm-mf7h-prrj)'
            }
        }
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'com.vanniktech.maven.publish' version '0.35.0'
    id 'signing'
    id 'eclipse'
    id 'idea'
}

description = 'A pure java JSON based database.'
group = 'io.jsondb'
version = getVersionName()

ext {
    println "Build Version: $version"

    slf4jVersion = '1.7.36'
    jacksonVersion = '2.23.0'
    guavaVersion = '33.8.0-jre'
    jxpathVersion = '1.4.0'
    reflectionsVersion = '0.10.2'
    junitVersion = '4.13.2'
    hamcrestVersion = '2.2'
}

// One artifact for every supported Java version: the build runs on JDK 17, but the code is compiled
// for Java 8, and the compiler rejects any API newer than Java 8.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'commons-collections' && details.requested.name == 'commons-collections') {
                details.useVersion '3.2.2'
                details.because 'Pin commons-collections to latest 3.x with security fixes'
            }
        }
    }
}

dependencies {
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation 'com.fasterxml.jackson.core:jackson-databind',
            'com.fasterxml.jackson.module:jackson-module-parameter-names',
            'com.fasterxml.jackson.datatype:jackson-datatype-jdk8',
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation "org.reflections:reflections:${reflectionsVersion}",
            "commons-jxpath:commons-jxpath:${jxpathVersion}",
            "com.google.guava:guava:${guavaVersion}"

    testImplementation "junit:junit:${junitVersion}",
            "org.hamcrest:hamcrest-library:${hamcrestVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
    // JDK 17 warns that compiling for Java 8 is obsolete; that is intended here
    options.compilerArgs << '-Xlint:-options'
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.test {
    useJUnit()
    jvmArgs(
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
    )
}

// The same tests on a real Java 8 runtime, the oldest Java this library supports. Compiling for
// Java 8 only proves the APIs exist; this proves the code behaves the same there.
tasks.register('testOnJava8', Test) {
    description = 'Runs the unit tests on a Java 8 runtime.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    useJUnit()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

eclipse {
    project {
        name = "${project.name}"
    }
}

eclipseJdt {
    inputFile = file("${rootDir}/buildsupport/eclipsesupport/settings/org.eclipse.jdt.core.prefs")
    doLast {
        copy {
            from "${rootDir}/buildsupport/eclipsesupport/settings/org.eclipse.jdt.ui.prefs"
            into "${projectDir}/.settings"
            fileMode 0644
        }
    }
}

cleanEclipseJdt {
    doFirst {
        delete "${projectDir}/.settings"
    }
}
tasks.eclipse.dependsOn(cleanEclipse)

/*
 * Publishing to Maven Central through the Central Portal. Credentials and the signing key never
 * live in this repository: they are read from ~/.gradle/gradle.properties. See RELEASING.md.
 */
mavenPublishing {
    configure(new com.vanniktech.maven.publish.JavaLibrary(new com.vanniktech.maven.publish.JavadocJar.Javadoc(), true))
    // Uploads a deployment that waits on central.sonatype.com until it is published by hand
    publishToMavenCentral()
    // Only sign when a key is configured, so contributors can still run publishToMavenLocal.
    // Maven Central rejects unsigned uploads, so a release cannot go out unsigned.
    if (project.hasProperty('signing.gnupg.keyName') || project.hasProperty('signingInMemoryKey')) {
        signAllPublications()
    }

    coordinates('io.jsondb', 'jsondb-core', version.toString())

    pom {
        name = 'jsondb-core'
        description = 'A pure java JSON based database.'
        inceptionYear = '2016'
        url = 'https://jsondb.github.io'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'FarooqKhan'
                name = 'Farooq Khan'
                email = 'FarooqKhan@users.noreply.github.com'
                url = 'https://github.com/FarooqKhan'
            }
        }

        scm {
            url = 'https://github.com/Jsondb/jsondb-core'
            connection = 'scm:git:https://github.com/Jsondb/jsondb-core.git'
            developerConnection = 'scm:git:ssh://git@github.com/Jsondb/jsondb-core.git'
        }
    }
}

signing {
    // Sign through the local gpg agent when ~/.gradle/gradle.properties names the key to use
    if (project.hasProperty('signing.gnupg.keyName')) {
        useGpgCmd()
    }
}

/*
 * Builds the version from the latest version-line tag and the number of commits since it: on the
 * commit tagged "1.1" `git describe` prints "1.1" and the version is 1.1.0; five commits later it
 * prints "1.1-5-gabc1234" and the version is 1.1.5. Only tags starting with a digit are version-line
 * tags; the "v1.1.0"-style tags that mark GitHub releases are ignored.
 */
def getVersionName() {
    def describe = providers.exec {
        commandLine 'git', 'describe', '--tags', '--match', '[0-9]*'
    }.standardOutput.asText.get().trim()
    def matcher = describe =~ /^(.+?)(?:-(\d+)-g[0-9a-f]+)?$/
    if (!matcher.matches()) {
        throw new GradleException("Cannot derive a version from git describe output: " + describe)
    }
    def commitsSinceTag = matcher.group(2) ?: '0'
    return matcher.group(1) + '.' + commitsSinceTag
}
