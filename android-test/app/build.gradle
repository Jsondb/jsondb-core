// Runs jsondb-core's API on a real Android runtime. jsondb-core comes from the parent folder
// through includeBuild in settings.gradle. From the repository root, with an emulator or device
// attached: ./gradlew -p android-test connectedDebugAndroidTest
plugins {
    id 'com.android.application'
}

android {
    namespace 'io.jsondb.android'
    compileSdk 36

    defaultConfig {
        applicationId 'io.jsondb.android'
        minSdk 26
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'io.jsondb:jsondb-core'

    // ReflectionPropertyHandler extends a JXPath class, and jsondb-core keeps JXPath off its
    // API. At runtime the app gets the version jsondb-core asks for.
    androidTestCompileOnly 'commons-jxpath:commons-jxpath:1.4.0'

    androidTestImplementation 'junit:junit:4.13.2',
            'androidx.test:runner:1.7.0',
            'androidx.test.ext:junit:1.3.0'
}
